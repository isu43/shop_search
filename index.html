<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>いい街こまつプレミアム｜取扱店検索</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Meiryo",sans-serif;
background:#f5f7fa;
color:#222;
}

header{
background:linear-gradient(135deg,#0b5cab,#1687d9);
color:white;
padding:40px 20px 55px;
text-align:center;
}

header h1{
margin:0;
font-size:clamp(28px,5vw,42px);
}

.container{
max-width:1200px;
margin:-25px auto 50px;
padding:0 18px;
}

.search-panel{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.search-row{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:12px;
margin-bottom:12px;
}

input,select{
height:48px;
padding:0 14px;
border:1px solid #d7dce2;
border-radius:10px;
font-size:15px;
}

.result-info{
display:flex;
justify-content:space-between;
margin:20px 5px;
font-weight:700;
}

.result-info span{
font-size:22px;
color:#0b5cab;
}

.store-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:18px;
}

.store-card{
background:white;
border-radius:16px;
padding:20px;
box-shadow:0 4px 16px rgba(0,0,0,.06);
transition:.2s;
}

.store-card:hover{
transform:translateY(-3px);
}

.category{
display:inline-block;
background:#e9f4ff;
color:#0b5cab;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
}

.store-name{
font-size:20px;
font-weight:bold;
margin-bottom:8px;
}

.facility{
color:#0b5cab;
font-size:13px;
margin-bottom:10px;
}

.address{
font-size:14px;
color:#555;
line-height:1.6;
}

.map-button{
display:block;
margin-top:15px;
padding:11px;
text-align:center;
text-decoration:none;
background:#f1f7fc;
color:#0b5cab;
border-radius:8px;
font-weight:bold;
}

.no-result{
display:none;
background:white;
padding:60px;
border-radius:15px;
text-align:center;
color:#777;
}

.loading{
text-align:center;
padding:60px;
font-size:18px;
color:#666;
}

@media(max-width:700px){
.search-row{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>いい街こまつプレミアム</h1>
<p>取扱店検索</p>
</header>

<div class="container">

<div class="search-panel">

<div class="search-row">

<input id="keyword" placeholder="店舗名・住所で検索">

<select id="category">
<option value="">すべての業種</option>
</select>

<select id="area">
<option value="">すべてのエリア</option>
</select>

</div>

</div>

<div class="result-info">
<div>該当店舗：<span id="resultCount">0</span>店</div>
</div>

<div id="loading" class="loading">
店舗データを読み込み中...
</div>

<div id="storeGrid" class="store-grid"></div>

<div id="noResult" class="no-result">
<h3>店舗が見つかりません</h3>
<p>検索条件を変更してください。</p>
</div>

</div>

<script>

let stores=[];

const keyword=document.getElementById("keyword");
const category=document.getElementById("category");
const area=document.getElementById("area");
const grid=document.getElementById("storeGrid");
const count=document.getElementById("resultCount");
const loading=document.getElementById("loading");
const noResult=document.getElementById("noResult");

async function loadStores(){

try{

const response=await fetch("stores.json");
const data=await response.json();

stores=Array.isArray(data)?data:(data.parsed_facility_stores||[]);

stores=stores.map(s=>({
name:s.name||"",
kana:s.kana||"",
category:s.category||"その他",
address:s.address||"",
facility:s.facility||""
}));

initialize();

loading.style.display="none";

}catch(e){

loading.innerHTML="データを読み込めませんでした。";

console.error(e);

}

}

function initialize(){

const categories=[...new Set(stores.map(s=>s.category))].sort();

categories.forEach(c=>{
const option=document.createElement("option");
option.value=c;
option.textContent=c;
category.appendChild(option);
});

const areas=[...new Set(stores.map(s=>getArea(s.address)))].sort();

areas.forEach(a=>{
const option=document.createElement("option");
option.value=a;
option.textContent=a;
area.appendChild(option);
});

displayStores(stores);

}

function getArea(address){

const m=address.match(/^([^0-9０-９丁目番地-]+町)/);

if(m) return m[1];

const m2=address.match(/^([^0-9０-９]+丁目)/);

if(m2) return m2[1];

return "その他";

}

function searchStores(){

const key=keyword.value.trim().toLowerCase();

const cat=category.value;
const ar=area.value;

const results=stores.filter(store=>{

const text=(store.name+" "+store.kana+" "+store.address+" "+store.facility).toLowerCase();

return(
(!key||text.includes(key))&&
(!cat||store.category===cat)&&
(!ar||getArea(store.address)===ar)
);

});

displayStores(results);

}

function displayStores(list){

grid.innerHTML="";
count.textContent=list.length;

if(list.length===0){

noResult.style.display="block";
return;

}

noResult.style.display="none";

list.forEach(store=>{

const card=document.createElement("article");
card.className="store-card";

const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("石川県小松市 "+store.address);

card.innerHTML=`
<div class="category">${escape(store.category)}</div>
<div class="store-name">${escape(store.name)}</div>
${store.facility?`<div class="facility">📍${escape(store.facility)}</div>`:""}
<div class="address">${escape(store.address)}</div>
<a class="map-button" href="${map}" target="_blank">Googleマップで見る</a>
`;

grid.appendChild(card);

});

}

function escape(str){

return String(str)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

keyword.addEventListener("input",searchStores);
category.addEventListener("change",searchStores);
area.addEventListener("change",searchStores);

loadStores();

</script>

</body>
</html>
