<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>いい街こまつプレミアム｜取扱店検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    background: #f5f7fa;
    color: #222;
}

/* ヘッダー */
header {
    background: linear-gradient(135deg, #0b5cab, #1687d9);
    color: white;
    padding: 42px 20px 55px;
    text-align: center;
}

header h1 {
    margin: 0 0 12px;
    font-size: clamp(25px, 5vw, 42px);
    font-weight: 800;
}

header p {
    margin: 0;
    opacity: .95;
    font-size: 15px;
}

/* メイン */
.container {
    max-width: 1200px;
    margin: -25px auto 50px;
    padding: 0 18px;
}

/* 検索ボックス */
.search-panel {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.search-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
}

.search-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 12px;
}

input,
select,
button {
    height: 48px;
    border-radius: 10px;
    border: 1px solid #d7dce2;
    font-size: 15px;
}

input,
select {
    padding: 0 14px;
    background: white;
}

input:focus,
select:focus {
    outline: 3px solid rgba(22,135,217,.15);
    border-color: #1687d9;
}

button {
    padding: 0 22px;
    border: 0;
    cursor: pointer;
    font-weight: 700;
}

.search-button {
    background: #0b5cab;
    color: white;
}

.search-button:hover {
    background: #084b8e;
}

.reset-button {
    background: #eef1f4;
    color: #333;
}

/* 件数 */
.result-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 3px;
}

.result-count {
    font-weight: 700;
}

.result-count span {
    color: #0b5cab;
    font-size: 22px;
}

/* カード */
.store-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.store-card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
    transition: .2s;
    border: 1px solid #edf0f3;
}

.store-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

.category {
    display: inline-block;
    background: #e9f4ff;
    color: #0b5cab;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
}

.store-name {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.5;
    margin-bottom: 5px;
}

.furigana {
    color: #777;
    font-size: 12px;
    margin-bottom: 15px;
}

.address {
    font-size: 14px;
    color: #555;
    line-height: 1.7;
    min-height: 48px;
}

.map-button {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #f1f7fc;
    color: #0b5cab;
    border-radius: 9px;
    padding: 11px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 700;
}

.map-button:hover {
    background: #dceefa;
}

/* 空結果 */
.no-result {
    background: white;
    border-radius: 15px;
    text-align: center;
    padding: 60px 20px;
    color: #777;
    display: none;
}

/* フッター */
footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 30px 20px;
}

footer a {
    color: #0b5cab;
}

/* スマホ */
@media (max-width: 900px) {
    .store-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-row {
        grid-template-columns: 1fr 1fr;
    }

    .search-button,
    .reset-button {
        width: 100%;
    }
}

@media (max-width: 600px) {
    header {
        padding: 30px 15px 45px;
    }

    .container {
        padding: 0 12px;
    }

    .search-panel {
        padding: 18px;
    }

    .search-row {
        grid-template-columns: 1fr;
    }

    .store-grid {
        grid-template-columns: 1fr;
    }

    .result-info {
        margin-top: 15px;
    }
}
</style>
</head>

<body>

    <p>取扱店検索</p>
</header>

<main class="container">

    <section class="search-panel">

        <div class="search-title">
            🔍 取扱店を検索

            <input

            <select id="area">

            <button class="search-button" onclick="searchStores()">
                検索
            </button>

        </div>

        <div style="margin-top:10px;">
            <button class="reset-button" onclick="resetSearch()">
                条件をクリア
            </button>
        </div>

    </section>

    <div class="result-info">
        <div class="result-count">
            該当店舗：
            <span id="resultCount">0</span> 店
        </div>
    </div>

    <section id="storeGrid" class="store-grid"></section>

    <div id="noResult" class="no-result">
        <div style="font-size:40px;">🔍</div>
        <h3>店舗が見つかりません</h3>
        <p>検索条件を変更して、もう一度お試しください。</p>
    </div>

</main>

<footer>
    <p>
        掲載情報は
        <a
            href="https://www.city.komatsu.lg.jp/soshiki/1018/shoukoushinkou_monodukuri/14337.html"

</footer>

/* ============================
   初期化
============================ */

const keywordInput = document.getElementById("keyword");
const categorySelect = document.getElementById("category");
const areaSelect = document.getElementById("area");
const storeGrid = document.getElementById("storeGrid");
const resultCount = document.getElementById("resultCount");
const noResult = document.getElementById("noResult");


function initialize() {

    // 業種
    const categories = [
        ...new Set(
            stores.map(store => store.category)
        )
    ].sort();

    categories.forEach(category => {

        const option = document.createElement("option");

        option.value = category;
        option.textContent = category;

        categorySelect.appendChild(option);

    });


    // 地域
    const areas = [
        ...new Set(
            stores.map(store => {

                const address = store.address;

                if (address.includes("清六町")) {
                    return "清六町";
                }

                if (address.includes("園町")) {
                    return "園町";
                }

                if (address.includes("平面町")) {
                    return "平面町";
                }

                return "その他";

            })
        )
    ];

    areas.forEach(area => {

        const option = document.createElement("option");

        option.value = area;
        option.textContent = area;

        areaSelect.appendChild(option);

    });


    displayStores(stores);
}


/* ============================
   検索
============================ */

function searchStores() {

    const keyword =
        keywordInput.value
        .trim()
        .toLowerCase();

    const category =
        categorySelect.value;

    const area =
        areaSelect.value;


    const results = stores.filter(store => {

        const searchText = (
            store.name +
            " " +
            store.kana +
            " " +
            store.address
        ).toLowerCase();


        const keywordMatch =
            !keyword ||
            searchText.includes(keyword);


        const categoryMatch =
            !category ||
            store.category === category;


        const areaMatch =
            !area ||
            getArea(store.address) === area;


        return (
            keywordMatch &&
            categoryMatch &&
            areaMatch
        );

    });


    displayStores(results);
}


/* ============================
   エリア判定
============================ */

function getArea(address) {

    if (address.includes("清六町")) {
        return "清六町";
    }

    if (address.includes("園町")) {
        return "園町";
    }

    if (address.includes("平面町")) {
        return "平面町";
    }

    return "その他";
}


/* ============================
   店舗表示
============================ */

function displayStores(results) {

    storeGrid.innerHTML = "";

    resultCount.textContent = results.length;


    if (results.length === 0) {

        noResult.style.display = "block";

        return;

    }


    noResult.style.display = "none";


    results.forEach(store => {

        const card =
            document.createElement("article");

        card.className = "store-card";


        const mapUrl =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
                "石川県小松市 " +
                store.address
            );


        card.innerHTML = `

            <div class="category">
                ${escapeHTML(store.category)}
            </div>

            <div class="store-name">
                ${escapeHTML(store.name)}
            </div>

            <div class="furigana">
                ${escapeHTML(store.kana)}
            </div>

            <div class="address">
                📍 ${escapeHTML(store.address)}
            </div>

            <a
                class="map-button"
                href="${mapUrl}"
                target="_blank"
                rel="noopener"
            >
                🗺️ Googleマップで見る
            </a>

        `;


        storeGrid.appendChild(card);

    });

}


/* ============================
   リセット
============================ */

function resetSearch() {

    keywordInput.value = "";

    categorySelect.value = "";

    areaSelect.value = "";

    displayStores(stores);

}


/* ============================
   HTMLエスケープ
============================ */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================
   Enterキーで検索
============================ */

keywordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchStores();

        }

    }
);


/* ============================
   自動検索
============================ */

categorySelect.addEventListener(
    "change",
    searchStores
);

areaSelect.addEventListener(
    "change",
    searchStores
);


/* 起動 */
initialize();
